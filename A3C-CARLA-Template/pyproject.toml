[project]
name = "a3c-carla-template"
version = "0.1.0"
description = "Plug-and-play Hogwild A3C training template for CARLA"
requires-python = ">=3.10,<3.12"
dependencies = [
    "carla==0.9.15",
    "numpy",
    "torch",
    "opencv-python",
    "networkx",
]

[project.optional-dependencies]
wandb = ["wandb"]
resources = ["psutil"]
